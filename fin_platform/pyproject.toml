[tool.poetry]
name = "finbot_platform"
version = "0.1.0"
description = ""
authors = ["KBI"]
readme = "README.md"

[tool.poetry.scripts]
start = "finbot_platform.__main__:main"

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.6.1"
langchain = "^0.0.354"
fastapi = "^0.108.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
sqlmodel = "^0.0.14"
mysql-connector = "^2.2.9"
tiktoken = "^0.5.2"
faiss-cpu = "^1.7.4"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
aiomysql = "^0.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncmy = "^0.2.9"
uvicorn = "^0.25.0"
async-timeout = "^4.0.3"
ujson = "^5.9.0"


[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.0"
pytest = "^7.4.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
